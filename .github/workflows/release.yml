name: Release
# Creates a new release for the latest commit on main.
# This workflow is triggered only manually.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [ patch, minor, major ]
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x

jobs:
  preflight:
    if: github.repository == 'schmitt-steven/Ostracon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get next version number
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(node -p "require('./package.json').version")
          tag=$(npm version "$BUMP" --no-git-tag-version)
          git checkout -- package.json package-lock.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### $current -> ${tag#v}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check tag is free
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [ preflight, ci ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bump version and tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "Release v%s"

      # Rejected if main changed since dispatch, so the release is what CI tested
      - name: Push
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
